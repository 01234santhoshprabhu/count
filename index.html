<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NPTEL Enrollment Live Dashboard</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #d9dee8;
      --blue: #1f5fa8;
      --green: #1c7c54;
      --amber: #9a6700;
      --red: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
    }
    header {
      background: #fff;
      border-bottom: 1px solid var(--line);
      padding: 18px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    h1 { margin: 0; font-size: 24px; line-height: 1.2; }
    .sub { color: var(--muted); margin-top: 4px; font-size: 13px; }
    main { max-width: 1180px; margin: 0 auto; padding: 22px; }
    .status {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      padding: 9px 11px;
      border-radius: 6px;
      font-size: 13px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }
    .metric, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .metric .label { color: var(--muted); font-size: 13px; }
    .metric .value { font-size: 30px; font-weight: 700; margin-top: 8px; }
    .metric.good .value { color: var(--green); }
    .metric.warn .value { color: var(--amber); }
    .wide {
      display: grid;
      grid-template-columns: 1.35fr .9fr;
      gap: 14px;
    }
    .actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    button, a.download {
      border: 1px solid #174f8a;
      background: var(--blue);
      color: #fff;
      padding: 9px 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      font-size: 14px;
    }
    button.secondary {
      background: #fff;
      color: var(--blue);
    }
    input[type="search"] {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 10px;
      min-width: 240px;
      font-size: 14px;
    }
    .panel h2 { margin: 0 0 12px; font-size: 17px; color: #23456f; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid #eef1f5; padding: 9px 8px; text-align: left; }
    th { color: var(--muted); font-weight: 600; background: #f5f7fa; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 18px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 16px;
    }
    .meta b { color: var(--ink); }
    .empty { color: var(--muted); padding: 10px 0; }
    .table-wrap {
      max-height: 560px;
      overflow: auto;
      border: 1px solid #eef1f5;
      border-radius: 6px;
    }
    .table-wrap table th {
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .note { color: var(--muted); font-size: 13px; }
    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .wide { grid-template-columns: 1fr; }
    }
    @media (max-width: 560px) {
      main { padding: 14px; }
      .grid { grid-template-columns: 1fr; }
      .meta { grid-template-columns: 1fr; }
      h1 { font-size: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>NPTEL Enrollment Live Dashboard</h1>
      <div class="sub">Display refreshes every 10 seconds. GitHub regenerates data about every 5 minutes.</div>
    </div>
    <div class="status" id="status">Loading...</div>
  </header>
  <main>
    <section class="meta" id="meta"></section>
    <section class="grid">
      <div class="metric"><div class="label">Courses</div><div class="value" id="courses">-</div></div>
      <div class="metric good"><div class="label">Numeric Counts</div><div class="value" id="numeric">-</div></div>
      <div class="metric warn"><div class="label">Missing/Error</div><div class="value" id="errors">-</div></div>
      <div class="metric"><div class="label">Total Enrollment</div><div class="value" id="total">-</div></div>
    </section>
    <section class="wide">
      <div class="panel">
        <h2>Top Courses</h2>
        <table>
          <thead><tr><th>Course ID</th><th class="num">Learners</th></tr></thead>
          <tbody id="topRows"></tbody>
        </table>
      </div>
      <div class="panel">
        <h2>Missing Courses</h2>
        <div id="errorRows"></div>
      </div>
    </section>
    <section class="panel" style="margin-top:14px;">
      <h2>All Course Counts</h2>
      <div class="actions">
        <button id="copyBtn" type="button">Copy table</button>
        <a class="download" id="downloadLink" href="enrollment_report.csv" download>Download CSV</a>
        <input id="searchBox" type="search" placeholder="Search course ID">
        <span class="note" id="tableInfo"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Course ID</th><th class="num">Learners Enrolled</th></tr></thead>
          <tbody id="allRows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const fmt = new Intl.NumberFormat("en-IN");
    let allCourseRows = [];

    function text(value) {
      return value === undefined || value === null ? "" : String(value);
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let value = "";
      let quoted = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];
        if (quoted) {
          if (char === '"' && next === '"') {
            value += '"';
            i++;
          } else if (char === '"') {
            quoted = false;
          } else {
            value += char;
          }
        } else if (char === '"') {
          quoted = true;
        } else if (char === ",") {
          row.push(value);
          value = "";
        } else if (char === "\n") {
          row.push(value.replace(/\r$/, ""));
          rows.push(row);
          row = [];
          value = "";
        } else {
          value += char;
        }
      }
      if (value || row.length) {
        row.push(value);
        rows.push(row);
      }
      return rows;
    }

    function renderAllRows() {
      const query = document.getElementById("searchBox").value.trim().toLowerCase();
      const filtered = allCourseRows.filter(row => row.course_id.toLowerCase().includes(query));
      document.getElementById("tableInfo").textContent = `${fmt.format(filtered.length)} rows shown`;
      document.getElementById("allRows").innerHTML = filtered.map(row => `
        <tr><td>${text(row.course_id)}</td><td class="num">${text(row.count)}</td></tr>
      `).join("");
    }

    async function refreshTable() {
      const response = await fetch(`enrollment_report.csv?t=${Date.now()}`, { cache: "no-store" });
      const csvText = await response.text();
      const parsed = parseCsv(csvText).slice(1);
      allCourseRows = parsed
        .filter(row => row[0] && row[0] !== "TOTAL")
        .map(row => ({ course_id: row[0], count: row[1] }));
      document.getElementById("downloadLink").href = `enrollment_report.csv?t=${Date.now()}`;
      renderAllRows();
    }

    async function refreshDashboard() {
      const response = await fetch(`summary.json?t=${Date.now()}`, { cache: "no-store" });
      const data = await response.json();
      const updated = new Date(data.updated_at);

      document.getElementById("courses").textContent = fmt.format(data.course_count);
      document.getElementById("numeric").textContent = fmt.format(data.numeric_count);
      document.getElementById("errors").textContent = fmt.format(data.error_count);
      document.getElementById("total").textContent = fmt.format(data.total_enrollment);
      document.getElementById("status").textContent = `Last data update: ${updated.toLocaleString()}`;
      document.getElementById("meta").innerHTML = `
        <div>Data source: <b>GitHub Pages summary.json</b></div>
        <div>CSV report: <b>enrollment_report.csv</b></div>
        <div>Display refresh: <b>Every 10 seconds</b></div>
        <div>Automatic data regeneration: <b>About every 5 minutes</b></div>
        <div>Total enrollment: <b>${fmt.format(data.total_enrollment)}</b></div>
      `;
      document.getElementById("topRows").innerHTML = data.top_courses.map(row => `
        <tr><td>${text(row.course_id)}</td><td class="num">${fmt.format(row.count)}</td></tr>
      `).join("");
      document.getElementById("errorRows").innerHTML = data.errors.length
        ? `<table><thead><tr><th>Course ID</th><th>Status</th></tr></thead><tbody>${data.errors.map(row => `
            <tr><td>${text(row.course_id)}</td><td>${text(row.status)}</td></tr>
          `).join("")}</tbody></table>`
        : `<div class="empty">No missing courses.</div>`;
    }

    refreshDashboard().catch(error => {
      document.getElementById("status").textContent = `Could not load data: ${error}`;
    });
    refreshTable().catch(console.error);
    setInterval(() => {
      refreshDashboard().catch(console.error);
      refreshTable().catch(console.error);
    }, 10000);
    document.getElementById("searchBox").addEventListener("input", renderAllRows);
    document.getElementById("copyBtn").addEventListener("click", async () => {
      const lines = [["Course_ID", "Learners_Enrolled"], ...allCourseRows.map(row => [row.course_id, row.count])];
      const tableText = lines.map(row => row.join("\t")).join("\n");
      await navigator.clipboard.writeText(tableText);
      document.getElementById("copyBtn").textContent = "Copied";
      setTimeout(() => document.getElementById("copyBtn").textContent = "Copy table", 1500);
    });
  </script>
</body>
</html>
